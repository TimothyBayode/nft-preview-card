<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Timothy Bayode">
  <meta name="theme-color" content="hsl(217, 54%, 11%)">
  <meta name="apple-mobile-web-app-status-bar-style" content="hsl(217, 54%, 11%)">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | NFT preview card component</title>
</head>

<body>
  <div class="card">
    <div class="image-box">
      <img src="images/image-equilibrium.jpg" alt="Equilibrum" class="equilibrum">
        <div class="overlay">
          <img src="images/icon-view.svg" alt="View">
        </div>
    </div>
    <div class="eq-text">Equilibrium #3429</div>
    <p>Our Equilibrium collection promotes balance and calm.</p>

    <div class="parent">
      <div class="eth">
        <img src="images/icon-ethereum.svg" alt="Eth Icon">
        <div class="eth-text">0.041 ETH</div>
      </div>

      <div class="time">
        <img src="images/icon-clock.svg" alt="Timer" class="three">
        <p>3 days left</p>
      </div>
    </div>

    <div class="line"></div>

    <div class="author">
      <img src="images/image-avatar.png" alt="Author" style="width: 20px; border: 1px solid hsl(0, 0%, 100%); border-radius: 100%;">
      <div class="inf-text">Creation of <span class="emph">Jules Wyvern</span></div>
    </div>
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://timothybayode.vercel.app" target="_blank">Timothy Bayode</a>.
  </div>

</body>
</html>
